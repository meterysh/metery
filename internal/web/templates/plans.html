{{define "content"}}
<div class="mb-8">
  <h2 class="text-2xl font-bold text-gray-900 tracking-tight text-balance">Plans</h2>
</div>
<div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
  {{if .Plans}}
  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm whitespace-nowrap">
      <thead class="bg-gray-50 text-gray-500 uppercase tracking-wider text-xs font-medium border-b border-gray-200">
        <tr>
          <th class="px-6 py-4">Slug</th>
          <th class="px-6 py-4">Name</th>
          <th class="px-6 py-4">Features</th>
          <th class="px-6 py-4">Created</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {{range .Plans}}
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-3"><span class="font-mono text-xs font-medium tabular-nums text-gray-900">{{.Slug}}</span></td>
          <td class="px-6 py-3 text-gray-900 font-medium truncate max-w-xs">{{.Name}}</td>
          <td class="px-6 py-3 text-gray-500 font-mono text-xs truncate max-w-sm">{{if .Features}}{{.Features}}{{else}}—{{end}}</td>
          <td class="px-6 py-3 text-gray-500 tabular-nums">{{.CreatedAt}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
  {{else}}
  <div class="px-6 py-12 text-center text-gray-500">
    <svg aria-hidden="true" class="mx-auto h-12 w-12 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="4" rx="1"/>
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </svg>
    <p>No plans yet.</p>
  </div>
  {{end}}
</div>
{{end}}
