syntax = "proto3";

// Plans are templates binding features to grant configurations.
// Subscribing a customer to a plan materialises the plan's entries
// into entitlements + grants atomically. Boolean entries create only
// entitlements; metered entries also create the initial grant. When
// `Plan.recurrence` is set, the worker emits a fresh grant per entry
// for every active subscription on each interval boundary.
//
// Dual-ID: server-generated ULID `id` + caller-assigned `slug`
// (URL-safe). Subscriptions and external billing systems reference
// the plan by slug.
//
// Pricing is *not* stored here — Stripe (or another billing adapter)
// remains source-of-truth for what a plan costs. Store price IDs /
// product IDs in `metadata` if you need them.
package metery.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "metery/v1/common.proto";

option go_package = "github.com/meterysh/metery/gen/go/metery/v1;meteryv1";

message Plan {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-7][0-9a-hjkmnp-tv-z]{25}$"
  ]; // server-generated ULID
  string slug = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];
  string name = 3 [(buf.validate.field).required = true];
  // Feature bindings — what this plan entitles, with optional grant
  // templates for metered features.
  repeated PlanEntry entries = 4;
  // Cadence at which the recurrence worker emits a fresh set of grants
  // for every active subscription on this plan. Absent ⇒ one-shot
  // plan: subscribing materialises the initial grants and that's it.
  Recurrence recurrence = 5;
  google.protobuf.Struct metadata = 6;
  google.protobuf.Timestamp created_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp archived_at = 8;
}

// Single feature binding within a plan. Refs Feature by slug.
//   - Boolean features: omit `grant`; entitlement existence is the bit.
//   - Metered features: set `grant` to define initial / recurring credits.
//     `usage_period` optional; if set, configures balance windowing.
message PlanEntry {
  // Refs Feature.slug (immutable). Service validates the feature exists
  // and that `grant` shape matches the feature's metered/boolean kind.
  string feature_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];
  // For metered features only. Period over which usage is windowed
  // for balance computation (resets at each boundary).
  Period usage_period = 2;
  // Grant materialised when a customer subscribes. Required for
  // metered features that should ship with credits; omit for boolean.
  GrantTemplate grant = 3;
  // Period-boundary policy: how much of an unspent grant survives a
  // usage_period reset. Denormalised onto each emitted grant at
  // materialisation time. Omit ⇒ unused credits carry over uncapped.
  Rollover rollover = 4;
}

// Subscription-time grant config — what to create when materialising
// a plan entry. Mirrors CreateGrantRequest fields minus the path keys
// and `effective_at` (derived from Subscription.starts_at). Cadence
// lives on Plan.recurrence (one per plan); rollover lives on
// PlanEntry.rollover.
message GrantTemplate {
  int64 amount = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // Default 100 if absent. Lower number burns first.
  optional int32 priority = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // Optional expiration applied to each emitted grant.
  Expiration expiration = 3;
}

service PlanService {
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse) {
    option (google.api.http) = {
      post: "/v1/plans"
      body: "*"
      response_body: "plan"
    };
  }
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option (google.api.http) = {
      get: "/v1/plans/{id_or_slug}"
      response_body: "plan"
    };
  }
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option (google.api.http) = {
      get: "/v1/plans"
      response_body: "plans"
    };
  }
  // Soft archive — existing subscriptions keep working; new subscriptions
  // to archived plans are rejected.
  rpc ArchivePlan(ArchivePlanRequest) returns (ArchivePlanResponse) {
    option (google.api.http) = {delete: "/v1/plans/{id_or_slug}"};
  }
}

message CreatePlanRequest {
  string slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[a-z][a-z0-9_]*$"
    }
  ];
  string name = 2 [(buf.validate.field).required = true];
  repeated PlanEntry entries = 3;
  // Cadence at which the worker emits fresh grants for active
  // subscriptions on this plan. Absent ⇒ one-shot plan.
  Recurrence recurrence = 4;
  google.protobuf.Struct metadata = 5;
}
message CreatePlanResponse {
  Plan plan = 1 [(buf.validate.field).required = true];
}

message GetPlanRequest {
  // Either Plan.id (ULID) or Plan.slug. Server resolves.
  string id_or_slug = 1 [(buf.validate.field).required = true];
}
message GetPlanResponse {
  Plan plan = 1 [(buf.validate.field).required = true];
}

message ListPlansRequest {
  bool include_archived = 1;
  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 1000
  }];
  optional string after = 3 [(buf.validate.field).string.pattern = "^[0-7][0-9a-hjkmnp-tv-z]{25}$"];
}
message ListPlansResponse {
  repeated Plan plans = 1;
}

message ArchivePlanRequest {
  string id_or_slug = 1 [(buf.validate.field).required = true];
}
message ArchivePlanResponse {}
